<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yönetim Paneli | Prof. Dr. Yaşar Sertbaş</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Üst paneli sabitleme (Sticky) */
    .admin-header-fixed {
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 1000;
      padding: 20px 0 10px 0;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .admin-container { max-width: 900px; margin: 40px auto; padding: 20px; }
    .admin-card { background: white; padding: 30px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-md); }
    .admin-input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 8px; font-family: var(--font-sans); }
    .admin-label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--navy-800); }
    .hidden { display: none !important; }
    
    /* Yönetim Listesi ve Filtreler */
    .manage-list { display: grid; gap: 15px; }
    .manage-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
    .manage-item-info { display: flex; align-items: center; gap: 15px; }
    .manage-item-info h4 { margin: 0 0 5px 0; color: var(--navy-900); font-size: 1rem; }
    .manage-item-info span { font-size: 0.8rem; color: var(--muted); }
    
    .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .filter-btn { background: #f1f5f9; border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
    .filter-btn.active { background: var(--navy-700); color: white; border-color: var(--navy-700); }
    
    /* Toplu Silme Barı */
    .bulk-actions { display: flex; justify-content: space-between; align-items: center; background: #fef2f2; padding: 10px 15px; border-radius: 8px; border: 1px solid #fecaca; margin-bottom: 15px; }
    .bulk-delete-btn { background: #dc2626; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .bulk-delete-btn:disabled { background: #fca5a5; cursor: not-allowed; }
    
    .custom-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: var(--navy-700); }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="loginScreen" class="admin-container">
    <div class="admin-card">
      <h2 style="font-family: var(--font-serif); color: var(--navy-900); margin-bottom: 20px;">Yönetici Girişi</h2>
      <form id="loginForm">
        <label class="admin-label">E-posta</label>
        <input type="email" id="email" class="admin-input" required />
        <label class="admin-label">Şifre</label>
        <input type="password" id="password" class="admin-input" required />
        <button type="submit" class="btn btn--primary" style="width: 100%;">Giriş Yap</button>
      </form>
      <p id="loginMsg" style="color: var(--danger); margin-top: 15px; font-size: 0.9rem; font-weight: 600;"></p>
    </div>
  </div>

  <!-- YÖNETİM PANELİ -->
  <div id="adminPanel" class="admin-container hidden">
    
    <!-- SABİT ÜST PANEL -->
    <div class="admin-header-fixed">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 style="font-family: var(--font-serif); color: var(--navy-900); margin: 0;">İçerik Yönetimi</h2>
        <button id="logoutBtn" class="btn btn--ghost btn--sm">Çıkış Yap</button>
      </div>

      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button id="btnTabPub" class="btn btn--primary btn--sm" onclick="showTab('pubForm', 'btnTabPub')">Makale Ekle</button>
        <button id="btnTabFile" class="btn btn--ghost btn--sm" onclick="showTab('fileForm', 'btnTabFile')">Dosya Ekle</button>
        <button id="btnTabNews" class="btn btn--ghost btn--sm" onclick="showTab('newsForm', 'btnTabNews')">Haber Ekle</button>
        <button id="btnTabHero" class="btn btn--ghost btn--sm" onclick="showTab('heroForm', 'btnTabHero')">Ana Sayfa İçeriği Ekle</button>
        <button id="btnTabManage" class="btn btn--ghost btn--sm" onclick="showTab('manageForm', 'btnTabManage')">İçerikleri Yönet / Sil</button>
      </div>
    </div>

    <!-- MAKALE EKLEME FORMU -->
    <div id="pubForm" class="admin-card">
      <h3>Yeni Makale Ekle</h3>
      <form id="addPubForm">
        <label class="admin-label">Makale Başlığı</label>
        <input type="text" id="pubTitle" class="admin-input" required />
        <label class="admin-label">Yazarlar</label>
        <input type="text" id="pubAuthors" class="admin-input" />
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div><label class="admin-label">Dergi</label><input type="text" id="pubJournal" class="admin-input" /></div>
          <div><label class="admin-label">Yıl</label><input type="number" id="pubYear" class="admin-input" /></div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div>
            <label class="admin-label">Kategori</label>
            <select id="pubCategory" class="admin-input">
              <option value="makale">Makale</option>
              <option value="kitap">Kitap / Bölüm</option>
              <option value="sunum">Sunum</option>
            </select>
          </div>
          <div><label class="admin-label">DOI</label><input type="text" id="pubDoi" class="admin-input" /></div>
        </div>
        <label class="admin-label">PDF Dosyası (İsteğe Bağlı)</label>
        <input type="file" id="pubPdf" class="admin-input" accept=".pdf" />
        <button type="submit" class="btn btn--primary" style="margin-top: 10px;">Makaleyi Kaydet</button>
        <p id="pubMsg" style="margin-top: 10px; font-weight: 600;"></p>
      </form>
    </div>

    <!-- DOSYA EKLEME FORMU -->
    <div id="fileForm" class="admin-card hidden">
      <h3>Yeni Dosya / Sunum Ekle</h3>
      <form id="addFileForm">
        <label class="admin-label">Dosya Başlığı</label>
        <input type="text" id="fileTitle" class="admin-input" required />
        <label class="admin-label">Açıklama</label>
        <input type="text" id="fileDesc" class="admin-input" />
        <label class="admin-label">Dosya Seç</label>
        <input type="file" id="fileUpload" class="admin-input" required />
        <button type="submit" class="btn btn--primary" style="margin-top: 10px;">Dosyayı Yükle</button>
        <p id="fileMsg" style="margin-top: 10px; font-weight: 600;"></p>
      </form>
    </div>

    <!-- HABER EKLEME FORMU -->
    <div id="newsForm" class="admin-card hidden">
      <h3>Yeni Tıp Haberi Ekle</h3>
      <form id="addNewsForm">
        <label class="admin-label">Haber Başlığı</label>
        <input type="text" id="newsTitle" class="admin-input" required />
        <label class="admin-label">Kaynak</label>
        <input type="text" id="newsSource" class="admin-input" required />
        <label class="admin-label">Haber Linki (URL)</label>
        <input type="url" id="newsUrl" class="admin-input" required />
        <button type="submit" class="btn btn--primary" style="margin-top: 10px;">Haberi Kaydet</button>
        <p id="newsMsg" style="margin-top: 10px; font-weight: 600;"></p>
      </form>
    </div>

    <!-- ANA SAYFA (HERO) İÇERİK EKLEME FORMU -->
    <div id="heroForm" class="admin-card hidden">
      <h3>Ana Sayfa Slider İçeriği Ekle</h3>
      <form id="addHeroForm">
        <label class="admin-label">Başlık</label>
        <input type="text" id="heroTitle" class="admin-input" required placeholder="Örn: Güncel Tıp Yaklaşımları" />
        
        <label class="admin-label">Metin (Düşünceleriniz)</label>
        <textarea id="heroContent" class="admin-input" rows="4" required placeholder="Ana sayfada görünecek serbest metin..."></textarea>
        
        <label class="admin-label">Kapak Resmi (İsteğe Bağlı)</label>
        <input type="file" id="heroImage" class="admin-input" accept="image/*" />

        <label class="admin-label">Doküman / Sunum (İsteğe Bağlı)</label>
        <input type="file" id="heroPdf" class="admin-input" accept=".pdf, .doc, .docx, .ppt, .pptx" />
        
        <label class="admin-label">Yönlendirme Linki (İsteğe Bağlı - Harici Buton)</label>
        <input type="url" id="heroLink" class="admin-input" placeholder="https://..." />
        
        <button type="submit" class="btn btn--primary" style="margin-top: 10px;">İçeriği Kaydet</button>
        <p id="heroMsg" style="margin-top: 10px; font-weight: 600;"></p>
      </form>
    </div>

    <!-- İÇERİK YÖNETİMİ VE SİLME (Filtre + Toplu Silme) -->
    <div id="manageForm" class="admin-card hidden">
      <h3>Mevcut İçerikleri Yönet</h3>
      
      <!-- Filtre Butonları -->
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterManageList('all', this)">Tümü</button>
        <button class="filter-btn" onclick="filterManageList('publications', this)">Yayın / Makale</button>
        <button class="filter-btn" onclick="filterManageList('hero_content', this)">Slider İçeriği</button>
        <button class="filter-btn" onclick="filterManageList('news', this)">Haber</button>
        <button class="filter-btn" onclick="filterManageList('downloads', this)">Dosya</button>
      </div>

      <input type="text" id="manageSearch" class="admin-input" placeholder="Başlık ile ara..." style="margin-bottom: 15px;">
      
      <!-- Toplu Silme Barı -->
      <div class="bulk-actions">
        <span id="selectedCount" style="font-weight: 500; font-size: 0.9rem;">0 içerik seçildi</span>
        <button id="bulkDeleteBtn" class="bulk-delete-btn" disabled onclick="bulkDelete()">Seçilenleri Sil</button>
      </div>
      
      <div id="manageList" class="manage-list">
        <p>İçerikler yükleniyor...</p>
      </div>
    </div>
  </div> <!-- adminPanel kapanışı -->

  <!-- SUPABASE BAĞLANTISI VE MANTIK KODLARI -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    // SEKME DEĞİŞTİRME
    function showTab(formId, btnId) {
      ['pubForm', 'fileForm', 'newsForm', 'heroForm', 'manageForm'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(formId).classList.remove('hidden');

      ['btnTabPub', 'btnTabFile', 'btnTabNews', 'btnTabHero', 'btnTabManage'].forEach(id => {
        const el = document.getElementById(id);
        if (el) { el.classList.remove('btn--primary'); el.classList.add('btn--ghost'); }
      });

      const activeBtn = document.getElementById(btnId);
      if (activeBtn) { activeBtn.classList.remove('btn--ghost'); activeBtn.classList.add('btn--primary'); }

      if (formId === 'manageForm') { loadManageList(); }
    }

    // OTURUM KONTROLÜ
    async function checkUser() {
      const { data: { session } } = await supabaseClient.auth.getSession(); 
      if (session) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
      } else {
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
      }
    }
    checkUser();

    // GİRİŞ / ÇIKIŞ
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const msgEl = document.getElementById('loginMsg');
      msgEl.style.color = "blue"; msgEl.textContent = "Giriş yapılıyor...";
      try {
        const { error } = await supabaseClient.auth.signInWithPassword({ 
          email: document.getElementById('email').value, password: document.getElementById('password').value 
        });
        if (error) throw error;
        msgEl.textContent = ""; checkUser(); 
      } catch (err) {
        msgEl.style.color = "red"; msgEl.textContent = "Hata: " + err.message;
      }
    };

    document.getElementById('logoutBtn').onclick = async () => {
      await supabaseClient.auth.signOut(); checkUser();
    };

    // DOSYA YÜKLEME YARDIMCISI
    async function uploadFile(bucket, file) {
      if (!file) return null;
      const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
      const filePath = `${Date.now()}_${safeName}`;
      const { data, error } = await supabaseClient.storage.from(bucket).upload(filePath, file);
      if (error) throw new Error(error.message);
      return supabaseClient.storage.from(bucket).getPublicUrl(data.path).data.publicUrl;
    }

    // FORMLARI KAYDETME İŞLEMLERİ
    document.getElementById('addPubForm').onsubmit = async (e) => {
      e.preventDefault(); const btn = e.target.querySelector('button'); const msgEl = document.getElementById('pubMsg');
      btn.textContent = "Kaydediliyor..."; msgEl.textContent = "";
      try {
        let pdfUrl = await uploadFile('publication-pdfs', document.getElementById('pubPdf').files[0]);
        const { error } = await supabaseClient.from('publications').insert([{
          title: document.getElementById('pubTitle').value, authors: document.getElementById('pubAuthors').value,
          journal: document.getElementById('pubJournal').value, year: document.getElementById('pubYear').value,
          category: document.getElementById('pubCategory').value, doi: document.getElementById('pubDoi').value, pdf_url: pdfUrl
        }]);
        if (error) throw error;
        msgEl.style.color = "green"; msgEl.textContent = "Makale eklendi!"; e.target.reset();
      } catch (err) { msgEl.style.color = "red"; msgEl.textContent = err.message; }
      finally { btn.textContent = "Makaleyi Kaydet"; }
    };

    document.getElementById('addFileForm').onsubmit = async (e) => {
      e.preventDefault(); const btn = e.target.querySelector('button'); const msgEl = document.getElementById('fileMsg');
      btn.textContent = "Yükleniyor..."; msgEl.textContent = "";
      try {
        const publicUrl = await uploadFile('downloadable-files', document.getElementById('fileUpload').files[0]);
        const { error } = await supabaseClient.from('downloads').insert([{
          title: document.getElementById('fileTitle').value, description: document.getElementById('fileDesc').value, file_url: publicUrl
        }]);
        if (error) throw error;
        msgEl.style.color = "green"; msgEl.textContent = "Dosya yüklendi!"; e.target.reset();
      } catch (err) { msgEl.style.color = "red"; msgEl.textContent = err.message; }
      finally { btn.textContent = "Dosyayı Yükle"; }
    };

    document.getElementById('addNewsForm').onsubmit = async (e) => {
      e.preventDefault(); const btn = e.target.querySelector('button'); const msgEl = document.getElementById('newsMsg');
      btn.textContent = "Kaydediliyor..."; msgEl.textContent = "";
      try {
        const { error } = await supabaseClient.from('news').insert([{
          title: document.getElementById('newsTitle').value, source: document.getElementById('newsSource').value, url: document.getElementById('newsUrl').value
        }]);
        if (error) throw error;
        msgEl.style.color = "green"; msgEl.textContent = "Haber eklendi!"; e.target.reset();
      } catch (err) { msgEl.style.color = "red"; msgEl.textContent = err.message; }
      finally { btn.textContent = "Haberi Kaydet"; }
    };

    document.getElementById('addHeroForm').onsubmit = async (e) => {
      e.preventDefault(); const btn = e.target.querySelector('button'); const msgEl = document.getElementById('heroMsg');
      btn.textContent = "Kaydediliyor..."; msgEl.textContent = "";
      try {
        let imageUrl = await uploadFile('hero-images', document.getElementById('heroImage').files[0]);
        let pdfUrl = await uploadFile('hero-files', document.getElementById('heroPdf').files[0]); 
        const { error } = await supabaseClient.from('hero_content').insert([{
          title: document.getElementById('heroTitle').value, content: document.getElementById('heroContent').value,
          image_url: imageUrl, link_url: document.getElementById('heroLink').value, pdf_url: pdfUrl 
        }]);
        if (error) throw error;
        msgEl.style.color = "green"; msgEl.textContent = "Ana sayfa içeriği eklendi!"; e.target.reset();
      } catch (err) { msgEl.style.color = "red"; msgEl.textContent = "Hata: " + err.message; }
      finally { btn.textContent = "İçeriği Kaydet"; }
    };

    // --- İÇERİK YÖNETİMİ (SİLME, FİLTRELEME VE SEÇİM) ---
    let allManageItems = []; // Tüm verileri burada tutacağız

    async function loadManageList() {
      const listEl = document.getElementById('manageList');
      listEl.innerHTML = '<p>İçerikler yükleniyor...</p>';
      allManageItems = []; // Sıfırla
      
      try {
        const pubs = await supabaseClient.from('publications').select('id, title');
        const files = await supabaseClient.from('downloads').select('id, title');
        const news = await supabaseClient.from('news').select('id, title');
        const hero = await supabaseClient.from('hero_content').select('id, title');

        // Verileri tek bir listede topla
        const addItems = (data, table, type) => {
          if (data) data.forEach(item => allManageItems.push({ id: item.id, title: item.title, table: table, typeName: type }));
        };
        
        addItems(pubs.data, 'publications', 'Yayın / Makale');
        addItems(files.data, 'downloads', 'İndirilebilir Dosya');
        addItems(news.data, 'news', 'Haber');
        addItems(hero.data, 'hero_content', 'Ana Sayfa Slider İçeriği');

        renderManageList('all'); // Başlangıçta hepsini göster
        updateSelectionCount();
      } catch (err) {
        listEl.innerHTML = `<p style="color: red;">Sistem Hatası: ${err.message}</p>`;
      }
    }

    function renderManageList(filterType) {
      const listEl = document.getElementById('manageList');
      const searchTerm = document.getElementById('manageSearch').value.toLowerCase('tr');
      
      // Filtrele (Hem kategoriye hem aramaya göre)
      const filtered = allManageItems.filter(item => {
        const matchesType = filterType === 'all' || item.table === filterType;
        const matchesSearch = item.title.toLowerCase('tr').includes(searchTerm);
        return matchesType && matchesSearch;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = '<p>Eşleşen içerik bulunamadı.</p>';
        return;
      }

      listEl.innerHTML = filtered.map(item => `
        <div class="manage-item">
          <div class="manage-item-info">
            <input type="checkbox" class="custom-checkbox item-checkbox" data-id="${item.id}" data-table="${item.table}" onchange="updateSelectionCount()">
            <div>
              <h4>${item.title || 'Başlıksız İçerik'}</h4>
              <span>${item.typeName}</span>
            </div>
          </div>
          <button class="delete-btn" onclick="deleteItem('${item.table}', '${item.id}')">Sil</button>
        </div>
      `).join('');
    }

    // Arama çubuğu dinleyicisi
    document.getElementById('manageSearch').addEventListener('input', function() {
      const activeFilter = document.querySelector('.filter-btn.active').textContent;
      let filterType = 'all';
      if(activeFilter === 'Yayın / Makale') filterType = 'publications';
      if(activeFilter === 'Slider İçeriği') filterType = 'hero_content';
      if(activeFilter === 'Haber') filterType = 'news';
      if(activeFilter === 'Dosya') filterType = 'downloads';
      
      renderManageList(filterType);
    });

    // Kategori Filtresi Dinleyicisi
    function filterManageList(type, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderManageList(type);
    }

    // Seçim Sayacı ve Toplu Silme Butonu Durumu
    function updateSelectionCount() {
      const checked = document.querySelectorAll('.item-checkbox:checked');
      const countSpan = document.getElementById('selectedCount');
      const bulkBtn = document.getElementById('bulkDeleteBtn');
      
      countSpan.textContent = `${checked.length} içerik seçildi`;
      bulkBtn.disabled = checked.length === 0;
    }

    // --- STORAGE'DAN FİZİKSEL DOSYA SİLME YARDIMCISI ---
    async function deleteFileFromStorage(url) {
      if (!url) return;
      try {
        if (url.includes('/public/')) {
          const parts = url.split('/public/')[1].split('/');
          const bucket = parts[0];
          const filePath = parts.slice(1).join('/');
          const { error } = await supabaseClient.storage.from(bucket).remove([filePath]);
          if (error) console.warn("Storage'dan dosya silinemedi:", error.message);
        }
      } catch (e) {
        console.error("Dosya silme hatası:", e);
      }
    }

    // --- TEKLİ SİLME (GÜNCELLENDİ) ---
    window.deleteItem = async (table, id) => {
      if (!confirm("Bu içeriği ve varsa bağlı dosyalarını kalıcı olarak silmek istediğinize emin misiniz?")) return;
      
      try {
        // 1. Silmeden önce veriyi çek (Dosya linklerini almak için)
        const { data: item } = await supabaseClient.from(table).select('*').eq('id', id).single();

        // 2. Veritabanı satırını sil
        const { error } = await supabaseClient.from(table).delete().eq('id', id);
        if (error) throw error;

        // 3. Eğer veride dosya linki varsa, Storage'dan da sil
        if (item) {
          if (item.pdf_url) await deleteFileFromStorage(item.pdf_url);
          if (item.file_url) await deleteFileFromStorage(item.file_url);
          if (item.image_url) await deleteFileFromStorage(item.image_url);
        }

        loadManageList(); // Listeyi yenile
      } catch (err) {
        alert("Silme Hatası: " + err.message);
      }
    };

    // --- TOPLU SİLME (GÜNCELLENDİ) ---
    async function bulkDelete() {
      const checked = Array.from(document.querySelectorAll('.item-checkbox:checked'));
      if (checked.length === 0) return;

      if (!confirm(`${checked.length} adet içeriği ve varsa bağlı dosyalarını kalıcı olarak silmek istediğinize emin misiniz?`)) return;

      const itemsByTable = {};
      checked.forEach(box => {
        const table = box.getAttribute('data-table');
        const id = box.getAttribute('data-id');
        if (!itemsByTable[table]) itemsByTable[table] = [];
        itemsByTable[table].push(id);
      });

      try {
        for (const [table, ids] of Object.entries(itemsByTable)) {
          // 1. Silinecek tüm verileri çek (Dosya linklerini almak için)
          const { data: itemsToDelete } = await supabaseClient.from(table).select('*').in('id', ids);

          // 2. Veritabanından topluca sil
          const { error } = await supabaseClient.from(table).delete().in('id', ids);
          if (error) throw error;

          // 3. Storage'dan fiziksel dosyaları sil
          if (itemsToDelete) {
            for (const item of itemsToDelete) {
              if (item.pdf_url) await deleteFileFromStorage(item.pdf_url);
              if (item.file_url) await deleteFileFromStorage(item.file_url);
              if (item.image_url) await deleteFileFromStorage(item.image_url);
            }
          }
        }
        loadManageList();
      } catch (err) {
        alert("Toplu Silme Hatası: " + err.message);
      }
    }
  </script>
</body>
</html>
